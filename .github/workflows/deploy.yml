name: Deploy Shiny app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            shiny
            bslib
            plotly
            DT
            shinylive

      - name: Export app with shinylive
        run: |
          favicon <- '<link rel="icon" type="image/png" href="favicon.png">'
          bridge <- paste0(
            '<script>(function(){',
            'var q=new URLSearchParams(window.location.search);',
            'if(!q.toString()){return;}',
            'var p=JSON.stringify(Object.fromEntries(q));',
            'var t=0;',
            'var iv=setInterval(function(){',
            'if(window.Shiny&&window.Shiny.setInputValue){',
            'window.Shiny.setInputValue("url_query",p);',
            'if(++t>600){clearInterval(iv);}}',
            'else if(++t>600){clearInterval(iv);}}',
            ',500);})();</script>'
          )
          shinylive::export(
            appdir = "app",
            destdir = "site",
            template_params = list(
              title = "USH2A App",
              include_in_head = paste0(favicon, bridge)
            )
          )
        shell: Rscript {0}

      - name: Copy favicon to site root
        run: cp app/favicon.png site/favicon.png

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
